name: Release V1 (core + Poseidon V1)

# Publishes the Java 8 line: com.legacyminecraft.bans:core and :lmbd-poseidon.
# Manual only — release repositories reject a redeploy of an existing version, so this must
# not fire automatically on every push. Bump the module version, then run this.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only, do not publish"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-v1
  cancel-in-progress: false

env:
  # Not a JDK 8 build: the modules compile with release 8, which needs a JDK 9+ javac.
  # release 8 is what pins the artifacts to Java 8 bytecode and the Java 8 API surface.
  JAVA_VERSION: "21"
  MAVEN_CLI_OPTS: "-B -ntp"
  MODULES: "core,poseidon"

jobs:
  release:
    name: Release V1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # server-id must match the <id> in each module's <distributionManagement>, or
      # `mvn deploy` skips the credentials and fails with a 401.
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: johnymuffin-nexus
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Read module versions
        id: version
        run: |
          CORE=$(mvn $MAVEN_CLI_OPTS -q -pl core -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)
          PLUGIN=$(mvn $MAVEN_CLI_OPTS -q -pl poseidon -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)
          echo "core=$CORE" >> $GITHUB_OUTPUT
          echo "plugin=$PLUGIN" >> $GITHUB_OUTPUT
          echo "core $CORE / lmbd-poseidon $PLUGIN"

      - name: Build and test
        run: mvn $MAVEN_CLI_OPTS -pl $MODULES clean install

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: lmbd-v1-jars
          if-no-files-found: error
          path: |
            core/target/*.jar
            poseidon/target/*.jar
            !**/original-*.jar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-v1
          if-no-files-found: ignore
          path: "**/target/surefire-reports/**"

      # core changes far less often than the plugin and is shared with the V2 line, so its
      # version is usually unchanged at release time. maven-releases rejects a redeploy, which
      # would fail the whole run, so only include core when this exact version is not there yet.
      # The plugin still resolves core from the local repository the build step installed.
      - name: Decide deploy targets
        id: targets
        run: |
          CORE_VERSION="${{ steps.version.outputs.core }}"
          CORE_POM="https://repository.legacyminecraft.com/repository/maven-releases/com/legacyminecraft/bans/core/$CORE_VERSION/core-$CORE_VERSION.pom"
          if [ "${CORE_VERSION%-SNAPSHOT}" != "$CORE_VERSION" ] || ! curl -sfI --max-time 30 "$CORE_POM" > /dev/null; then
            echo "modules=core,poseidon" >> $GITHUB_OUTPUT
            echo "core $CORE_VERSION is not published yet; it will be deployed"
          else
            echo "modules=poseidon" >> $GITHUB_OUTPUT
            echo "core $CORE_VERSION is already in Nexus; deploying the plugin only"
          fi

      # A -SNAPSHOT version lands in maven-snapshots and can be republished freely;
      # a release version lands in maven-releases and only once.
      - name: Deploy to Nexus
        if: ${{ !inputs.dry_run }}
        run: mvn $MAVEN_CLI_OPTS -pl ${{ steps.targets.outputs.modules }} -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      # Snapshots are not tagged; only a real version gets a GitHub release.
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && !endsWith(steps.version.outputs.plugin, '-SNAPSHOT') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1-${{ steps.version.outputs.plugin }}
          name: Poseidon V1 ${{ steps.version.outputs.plugin }}
          fail_on_unmatched_files: true
          # Anchored on the artifactId: this cannot match shade's original-*.jar backup.
          # Do not use '!' negation here, this action does not support it.
          files: |
            core/target/core-*.jar
            poseidon/target/lmbd-poseidon-*.jar

      - name: Summary
        run: |
          {
            echo "### V1 release"
            echo ""
            echo "| Artifact | Version |"
            echo "| --- | --- |"
            echo "| core | ${{ steps.version.outputs.core }} |"
            echo "| lmbd-poseidon | ${{ steps.version.outputs.plugin }} |"
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run: nothing was published."
            else
              echo "Published to Nexus."
            fi
          } >> $GITHUB_STEP_SUMMARY
