name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

# This workflow only builds and verifies. Publishing lives in release-v1.yml and
# release-v2.yml, which are manual so a release is never triggered by a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must be 25: poseidon-v2 compiles with release 25. core and poseidon still compile
  # with release 8 on the same JDK, which keeps them running on Java 8 servers.
  JAVA_VERSION: "25"
  MAVEN_CLI_OPTS: "-B -ntp"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Read Maven project version
        id: version
        run: |
          VERSION=$(mvn $MAVEN_CLI_OPTS -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build
        run: mvn $MAVEN_CLI_OPTS clean install

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: lmbd-jars
          if-no-files-found: error
          path: |
            core/target/*.jar
            poseidon/target/*.jar
            poseidon-v2/target/*.jar
            !**/original-*.jar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          if-no-files-found: ignore
          path: "**/target/surefire-reports/**"
